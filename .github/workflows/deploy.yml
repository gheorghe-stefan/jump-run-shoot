name: Deploy jump-run-shoot to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM App
        run: dotnet publish JumpRunShoot.csproj -c Release -o release

      - name: Rewrite Base Href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/jump-run-shoot/" />|g' release/wwwroot/index.html

      - name: Copy 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Ensure .nojekyll Exists
        run: touch release/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
