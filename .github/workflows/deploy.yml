name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM App
        run: dotnet publish JumpRunShoot.csproj -c Release -o release

      - name: Rewrite Base Href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/jump-run-shoot/" />|g' release/wwwroot/index.html

      - name: Create 404 Fallback for SPA Routing
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Ensure .nojekyll Exists
        run: |
          touch release/wwwroot/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/wwwroot
          publish_branch: gh-pages
